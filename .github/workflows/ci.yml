name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Code Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,models/
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,models/

      - name: Validate Python Modules Syntax & Imports
        run: |
          python -m py_compile Home.py mobile_app.py
          python -m py_compile pages/1_Register_New_Case.py
          python -m py_compile pages/2_All_Cases.py
          python -m py_compile pages/3_Match_Cases.py
          python -m py_compile pages/4_Help.py
          python -m py_compile pages/5_CCTV_Video_Scanner.py
          python -m py_compile pages/helper/*.py
          echo "All Python source files compiled and validated successfully!"
